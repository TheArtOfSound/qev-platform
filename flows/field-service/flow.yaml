id: field-service
version: 0.1.0
title: Field Service Job Evidence
status: mvp
description: >
  Reusable field-service evidence for contractors and small businesses.
  AH Crap is deployment #1 after Stage 0–1 — not a custom format.

mode_default: shadow

connectors:
  - job-portal
  - photo-file
  - generic-webhook

lifecycle:
  - job.created
  - estimate.prepared
  - estimate.approved
  - evidence.before_captured
  - work.started
  - scope.changed
  - change.approved
  - work.completed
  - evidence.after_captured
  - invoice.issued
  - payment.recorded
  - customer.completion_confirmed
  - package.sealed

required_for_seal:
  - job.created
  - estimate.approved
  - evidence.before_captured
  - work.completed
  - evidence.after_captured

optional:
  - estimate.prepared
  - work.started
  - scope.changed
  - change.approved
  - invoice.issued
  - payment.recorded
  - customer.completion_confirmed

privacy_defaults:
  default_mode: full
  field_modes:
    customer_phone: redacted
    customer_email: redacted
    card_last4: hash_only
    internal_notes: drop

review_questions:
  - What job is this?
  - Who approved the estimate?
  - Were before photos captured?
  - Was scope changed, and was the change approved?
  - Were after photos captured?
  - What evidence is missing?
  - Did the package change after sealing?

claims_boundary: >
  Package establishes integrity of recorded events under stated trust model.
  Does not prove work quality, legal liability, or that unlogged actions never occurred.

gate_mode_later:
  - do not begin added work without change.approved
  - do not seal without required evidence (when gate enabled)
  - do not release package containing internal_notes
